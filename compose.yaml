# plakar-ui et son sidecar Tailscale. Le service partage le réseau du sidecar
# et n'écoute que sur localhost ; aucun port n'est publié sur l'hôte : on ne
# l'atteint que par le tailnet, en HTTPS, via `tailscale serve`.
#
# Variables : voir .env.example (cp .env.example .env).
#
# Les dossiers de PLAKAR_UI_APPDATA sont à préparer avant `docker compose up`
# (sinon Docker les crée en root, et plakar-ui ne peut pas y écrire) et doivent
# appartenir à 1000:1000, l'utilisateur de l'image :
#   mkdir -p $PLAKAR_UI_APPDATA/{tailscale,serve,plakar-config,plakar-cache,plakar-data,state}
#   chown 1000:1000 $PLAKAR_UI_APPDATA/{serve,plakar-config,plakar-cache,plakar-data,state}
#   chmod 700 $PLAKAR_UI_APPDATA/plakar-config

services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: plakar-ui
    environment:
      #TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY est requis, voir .env.example}
      TS_HOSTNAME: plakar-ui
      TS_STATE_DIR: /var/lib/tailscale
      # Mode TUN noyau, et surtout pas userspace : en userspace, tailscaled
      # relaie vers 127.0.0.1:<port> toute connexion du tailnet sur un port que
      # serve ne gère pas. Un pair joindrait alors le tableau de bord (8080)
      # sans passer par serve, en forgeant Tailscale-User-Login. En TUN, le
      # trafic du tailnet arrive sur tailscale0, et localhost reste injoignable.
      TS_USERSPACE: "false"
      # Écrite par plakar-ui à son démarrage (443 et la plage d'Exploration),
      # surveillée et réappliquée par le sidecar dès qu'elle change.
      TS_SERVE_CONFIG: /serve/serve.json
    volumes:
      - ${PLAKAR_UI_APPDATA}/tailscale:/var/lib/tailscale
      # Un dossier, pas un fichier : le sidecar ne verrait pas les
      # remplacements atomiques d'un fichier monté seul.
      - ${PLAKAR_UI_APPDATA}/serve:/serve:ro
    # Requis par le mode TUN. Dans un LXC Proxmox, /dev/net/tun doit être
    # autorisé dans la conf du conteneur (ticket 09).
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # Posé ici et non sur plakar-ui : un conteneur qui partage le réseau d'un
    # autre en partage aussi le /etc/hosts.
    extra_hosts:
      - "unraid:${UNRAID_IP:?UNRAID_IP est requis, voir .env.example}"
    restart: unless-stopped

  plakar-ui:
    build: .
    image: plakar-ui:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      PLAKAR_UI_UTILISATEURS: ${PLAKAR_UI_UTILISATEURS:?PLAKAR_UI_UTILISATEURS est requis, voir .env.example}
      PLAKAR_UI_HOTE: ${PLAKAR_UI_HOTE:?PLAKAR_UI_HOTE est requis, voir .env.example}
      PLAKAR_UI_SEUIL: ${PLAKAR_UI_SEUIL:-}
      PLAKAR_UI_INTERVALLE: ${PLAKAR_UI_INTERVALLE:-}
      PLAKAR_UI_INACTIVITE: ${PLAKAR_UI_INACTIVITE:-}
      PLAKAR_UI_PORTS: ${PLAKAR_UI_PORTS:-}
      PLAKAR_UI_DECALAGE: ${PLAKAR_UI_DECALAGE:-}
    volumes:
      - ${PLAKAR_UI_APPDATA}/plakar-config:/home/plakar/.config/plakar
      - ${PLAKAR_UI_APPDATA}/plakar-cache:/home/plakar/.cache/plakar
      # Paquets installés par `plakar pkg add` (plugins s3…).
      - ${PLAKAR_UI_APPDATA}/plakar-data:/home/plakar/.local/share/plakar
      - ${PLAKAR_UI_APPDATA}/state:/data
      - ${PLAKAR_UI_APPDATA}/serve:/serve
    restart: unless-stopped
