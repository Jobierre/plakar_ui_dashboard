<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>plakar-ui</title>
</head>
<body>
<h1>Stores</h1>
<table>
<thead>
<tr><th>Store</th><th>Dernier snapshot</th><th>Âge</th><th>ID</th><th>Taille</th><th>Écart de taille</th><th>Durée</th><th>Écart de durée</th><th>Source</th><th>Tags</th><th>Erreur</th></tr>
</thead>
<tbody>
{{- range .}}
<tr data-store="{{.Name}}"{{if .Pending}} data-pending{{end}}>
<td data-field="name">{{.Name}}</td>
{{- with .Latest}}
<td data-field="date">{{.Date}}</td>
<td data-field="age">{{.Age}}</td>
<td data-field="id">{{.ID}}</td>
<td data-field="size">{{.Size}}</td>
<td data-field="size-ecart"{{with .Previous}} title="{{.}}"{{end}}>{{.SizeEcart}}</td>
<td data-field="duration">{{.Duration}}</td>
<td data-field="duration-ecart"{{with .Previous}} title="{{.}}"{{end}}>{{.DurationEcart}}</td>
<td data-field="path">{{.Path}}</td>
<td data-field="tags">{{.Tags}}</td>
{{- else}}
<td data-field="latest" colspan="9">{{.Message}}</td>
{{- end}}
<td data-field="error">{{.Error}}</td>
</tr>
{{- end}}
</tbody>
</table>
</body>
</html>
